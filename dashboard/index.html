<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a0a0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>GoGetter Digital</title>
<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0a0a;--bg2:#141414;--bg3:#1e1e1e;--bg4:#282828;--orange:#ff6600;--green:#00e676;--red:#ff5252;--yellow:#ffd600;--text:#fff;--text2:#aaa;--text3:#666;--border:#2a2a2a}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px}
.hero{text-align:center;padding:32px 16px;background:linear-gradient(135deg,var(--bg2),var(--bg3));border-radius:16px;margin-bottom:20px;border:1px solid var(--border)}
.hero h1{font-size:26px;font-weight:800;background:linear-gradient(135deg,var(--orange),#ff8533);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hero p{color:var(--text2);font-size:15px;margin-top:6px}
.hero .badge{display:inline-block;background:var(--orange);color:#fff;padding:4px 12px;border-radius:20px;font-size:11px;font-weight:700;margin-top:10px}
#metrics-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:20px}
.metric-card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:14px;text-align:center;animation:fadeUp .4s ease both}
.metric-icon{font-size:20px;margin-bottom:4px}
.metric-value{font-size:24px;font-weight:800;color:var(--orange)}
.metric-label{color:var(--text2);font-size:11px;margin-top:2px}
.metric-trend{color:var(--green);font-size:10px;margin-top:4px}
.section{margin-bottom:20px}
.section-title{font-size:16px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--orange)}
#projects-grid{display:grid;gap:10px}
.project-card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:14px;animation:fadeUp .4s ease both}
.project-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.project-icon{font-size:18px}
.project-status{font-size:10px;padding:2px 8px;border-radius:8px;font-weight:600}
.status-in-progress{background:rgba(255,102,0,.15);color:var(--orange)}
.status-review{background:rgba(0,230,118,.15);color:var(--green)}
.status-starting{background:rgba(255,214,0,.15);color:var(--yellow)}
.status-qa{background:rgba(255,82,82,.15);color:var(--red)}
.project-name{font-weight:600;font-size:15px}
.project-client{color:var(--text2);font-size:12px}
.progress-bar{height:5px;background:var(--bg4);border-radius:3px;overflow:hidden;margin-top:8px}
.progress-fill{height:100%;background:var(--orange);border-radius:3px;transition:width .8s ease}
.project-footer{display:flex;justify-content:space-between;margin-top:6px;font-size:11px;color:var(--text2)}
#agents-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.agent-card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:12px;display:flex;align-items:center;gap:10px}
.agent-avatar{font-size:24px;width:36px;height:36px;display:flex;align-items:center;justify-content:center;background:var(--bg4);border-radius:50%;flex-shrink:0}
.agent-info{flex:1;min-width:0}
.agent-name{font-weight:600;font-size:13px}
.agent-role{color:var(--text2);font-size:10px}
.agent-task{color:var(--text3);font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.agent-status-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.agent-status-dot.active{background:var(--green)}
.agent-status-dot.idle{background:var(--text3)}
#activity-feed{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:12px}
.activity-item{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}
.activity-item:last-child{border-bottom:none}
.activity-icon{font-size:16px;flex-shrink:0;margin-top:2px}
.activity-content p{font-size:13px;color:var(--text2);line-height:1.4}
.activity-content strong{color:var(--text)}
.activity-time{font-size:10px;color:var(--text3);margin-top:2px;display:block}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--orange);color:#fff;padding:10px 20px;border-radius:20px;font-size:13px;font-weight:600;display:none;z-index:100}
.toast.show{display:block;animation:fadeUp .3s ease}
.footer{text-align:center;padding:16px;color:var(--text3);font-size:11px}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
<div class="hero">
  <h1>GoGetter Digital</h1>
  <p>Your 24/7 AI Tech Company</p>
  <div class="badge">AI-POWERED</div>
</div>

<div id="metrics-grid"></div>

<div class="section">
  <div class="section-title"><span class="dot"></span>Active Projects</div>
  <div id="projects-grid"></div>
</div>

<div class="section">
  <div class="section-title"><span class="dot"></span>Agent Team</div>
  <div id="agents-grid"></div>
</div>

<div class="section">
  <div class="section-title"><span class="dot"></span>Recent Activity</div>
  <div id="activity-feed"></div>
</div>

<div class="footer">GoGetter Digital — Built by AI, Humanised by Bruce</div>
<div class="toast" id="toast"></div>
<script src="app.js"></script>
<script>if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js')</script>
</body>
</html>
